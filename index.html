<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>[Corner]</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,600&family=Old+Standard+TT:wght@400;700&display=swap">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene" tabindex="-1" aria-label="A newsstand with magazines and newspapers"></canvas>

  <header class="bar">
    <h1>[Corner]</h1>
  </header>

  <section class="intro">
    <h2>A newsstand you can read.</h2>
    <p>Click a newspaper to pick it up, turn its pages, then put it back.</p>
  </section>

  <nav class="index label" aria-label="Browse the stand">
    <details>
      <summary>Browse the stand</summary>
      <ul id="index-list"></ul>
    </details>
  </nav>

  <div id="tip" class="tip label" role="tooltip" hidden></div>

  <div id="reader" class="reader" role="group" aria-label="Reading" hidden>
    <button id="reader-prev" type="button" class="btn ghost label" aria-label="Previous page">Back</button>
    <span id="reader-count" class="count label" aria-live="polite"></span>
    <button id="reader-next" type="button" class="btn ghost label" aria-label="Next page">Next</button>
    <button id="reader-close" type="button" class="btn label">Put back</button>
  </div>
  <div id="reader-text" class="sr-only" aria-live="polite"></div>

  <div id="loading" class="loading"><p>Stocking the shelves…</p></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
