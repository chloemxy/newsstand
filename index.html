<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Corner Kiosk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..600&family=Marcellus&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,600&family=Old+Standard+TT:wght@400;700&display=swap">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene" tabindex="-1" aria-label="A newsstand with magazines and newspapers"></canvas>

  <header class="bar">
    <h1 aria-label="Corner Kiosk"><span>Corner</span><span>Kiosk</span></h1>
  </header>

  <section class="intro">
    <div class="pair label"><span>Corner</span><span>Kiosk</span></div>
    <h2>A newsstand you can read.</h2>
    <p>Drag to look around. Click a magazine or newspaper to pick it up, turn its pages, then put it back.</p>
  </section>

  <nav class="index label" aria-label="Browse the stand">
    <details>
      <summary>Browse the stand</summary>
      <ul id="index-list"></ul>
    </details>
  </nav>

  <div id="tip" class="tip label" role="tooltip" hidden></div>

  <aside id="reader" class="reader" aria-labelledby="reader-title" hidden>
    <header>
      <p id="reader-kind" class="eyebrow label"></p>
      <h2 id="reader-title"></h2>
      <p id="reader-meta" class="meta"></p>
    </header>
    <div id="reader-pages" class="pages" aria-live="polite"></div>
    <footer>
      <div class="pager">
        <button id="reader-prev" type="button" class="btn ghost label" aria-label="Previous page">Previous</button>
        <span id="reader-count" class="count label"></span>
        <button id="reader-next" type="button" class="btn ghost label" aria-label="Next page">Next</button>
      </div>
      <button id="reader-close" type="button" class="btn label">Put it back</button>
      <p class="keys label">← → to turn · Esc to close</p>
    </footer>
  </aside>

  <div id="loading" class="loading"><p>Stocking the shelves…</p></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
